name: Reusable build

on:
  workflow_call:
    outputs:
      image_tag:
        description: Tag pushed to GHCR (use this when deploying)
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/matshp0/githubrealeasenotifier

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          short=$(echo "${GITHUB_SHA}" | cut -c1-7)
          branch=$(echo "${GITHUB_REF_NAME}" | tr -c '[:alnum:]._-' '-')
          echo "tag=${branch}-${short}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-app:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAMESPACE }}-app:${{ steps.meta.outputs.branch }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-migrator:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAMESPACE }}-migrator:${{ steps.meta.outputs.branch }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
